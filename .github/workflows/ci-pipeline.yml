name: Combined Project CI Pipeline

on: [push, pull_request]

jobs:
  # ==========================================
  # JOB 1: PYTHON LINTING (PYLINT)
  # ==========================================
  python-lint:
    runs-on: ubuntu-latest
    # continue-on-error allows the overall workflow run status to manage failures independently
    continue-on-error: true 
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run Pylint Analysis
        run: pylint app.py --fail-under=9.0

  # ==========================================
  # JOB 2: ANSIBLE LINT & SYNTAX CHECKS
  # ==========================================
  ansible-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Ansible Tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible

      - name: Run yamllint
        run: yamllint site.yml

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v6
        with:
          args: site.yml

      - name: Run Ansible Playbook Syntax Check
        run: ansible-playbook site.yml --syntax-check

  # ==========================================
  # JOB 3: TERRAFORM LINT & VALIDATION
  # ==========================================
  terraform-checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "latest"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact
