name: Example multiple jobs
on: push
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Some test
        run: ls -ltra

  second-job:
    needs: first-job    #### so second job require first job to finish
    runs-on: ubuntu-latest
    steps:
      - name: Clone my repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Some test
        run: cat README.md
