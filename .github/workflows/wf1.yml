name: Matrix example2
on: 
  push:
  workflow_dispatch:
jobs:
  docker:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-20.04]
        images: [hello-world, alpine]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run image ${{ matrix.images }} on ${{ matrix.os }}
        run: docker run ${{ matrix.images }}
